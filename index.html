<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taalreis – leer talen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a href="./" class="logo">🌍 Taalreis</a>
    <span id="sync-status"></span>
  </header>
  <main id="app"></main>

  <script>
    // Laat een echte foutmelding zien als er iets misgaat, in plaats van een leeg scherm.
    window.addEventListener("error", function (e) {
      var el = document.getElementById("app");
      if (el && !el.children.length) {
        var p = document.createElement("p");
        p.style.cssText = "text-align:center;padding:40px 10px";
        p.textContent = "Er ging iets mis: " + (e.message || "onbekende fout") +
          (e.filename ? " (" + e.filename.split("/").pop() + ")" : "") +
          ". Controleer of data.js, app.js en style.css naast index.html staan.";
        el.appendChild(p);
      }
    });
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
