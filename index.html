<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taalreis – leer talen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a href="./" class="logo">🌍 Taalreis</a>
    <span id="sync-status"></span>
  </header>
  <main id="app"></main>
  <script type="module" src="app.js"></script>
  <script>
    // Als app.js niet start (bijvoorbeeld bij dubbelklikken op index.html), laat dan een duidelijke melding zien.
    setTimeout(function () {
      if (!window.__taalreisStarted) {
        document.getElementById("app").innerHTML =
          '<p style="text-align:center;padding:40px 10px">De site kan niet starten. ' +
          'Open hem via een webserver (bijvoorbeeld GitHub Pages of <code>python3 -m http.server</code>) ' +
          'en controleer of alle bestanden naast elkaar staan.</p>';
      }
    }, 2500);
  </script>
</body>
</html>
